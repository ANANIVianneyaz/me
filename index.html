<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0C0A14">
<title>MindFlow — Poste de pilotage</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230C0A14'/><path d='M22 70V30l28 22 28-22v40' stroke='%238B7BFF' stroke-width='9' fill='none' stroke-linejoin='round' stroke-linecap='round'/></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        base:    'var(--c-base)',
        surface: 'var(--c-surface)',
        raised:  'var(--c-raised)',
        line:    'var(--c-line)',
        ink:     'var(--c-ink)',
        muted:   'var(--c-muted)',
        faint:   'var(--c-faint)',
        signal:  'var(--c-signal)',
        teal:    'var(--c-teal)',
        good:    'var(--c-good)',
        bad:     'var(--c-bad)',
        violet:  'var(--c-violet)',
      },
      fontFamily: {
        display: ['"Space Grotesk"', 'system-ui', 'sans-serif'],
        mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
      },
      borderRadius: { xl2: '1.1rem' },
    }
  }
}
</script>
<style>
:root{                       /* thème violet (mode clair) */
  --c-base:#F3F0FB; --c-surface:#FFFFFF; --c-raised:#F8F5FE;
  --c-line:#E4DCF6; --c-ink:#1E1633; --c-muted:#665A82; --c-faint:#9A90B5;
  --c-signal:#6D28D9; --c-signal-soft:#EDE6FD; --c-on-signal:#FFFFFF;
  --c-teal:#4F46E5; --c-good:#0E8A50; --c-bad:#CE2F2F; --c-violet:#8B5CF6;
  --grid:rgba(109,40,217,.055);
}
html.dark{                   /* thème sombre */
  --c-base:#0C0A14; --c-surface:#15121F; --c-raised:#1B1729;
  --c-line:#2A2440; --c-ink:#E9E5F6; --c-muted:#9A90B8; --c-faint:#665C85;
  --c-signal:#8B7BFF; --c-signal-soft:#241E3C; --c-on-signal:#0C0A14;
  --c-teal:#5FA8FF; --c-good:#3DD68C; --c-bad:#F26A5F; --c-violet:#B79BFF;
  --grid:rgba(255,255,255,.045);
}
*{-webkit-tap-highlight-color:transparent}
body{
  background-color:var(--c-base); color:var(--c-ink);
  font-family:'Space Grotesk',system-ui,sans-serif;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
  padding-bottom:env(safe-area-inset-bottom);
}
.num{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--c-faint)}
.card{background:var(--c-surface);border:1px solid var(--c-line);border-radius:14px}
html:not(.dark) .card{box-shadow:0 1px 2px rgba(31,22,51,.05)}
html:not(.dark) #navDesktop{box-shadow:0 2px 10px rgba(31,22,51,.06)}
html:not(.dark) header{background-color:color-mix(in srgb,var(--c-base) 88%,transparent)}
html:not(.dark) .tbl th{background:var(--c-signal-soft);color:var(--c-signal)}
html:not(.dark) .tbl tbody tr:nth-child(even){background:color-mix(in srgb,var(--c-raised) 60%,transparent)}
.card-pad{padding:1.1rem}
.hair{border-color:var(--c-line)}
input,select,textarea{color-scheme:light}
html.dark input,html.dark select,html.dark textarea{color-scheme:dark}
.field{width:100%;background:var(--c-raised);border:1px solid var(--c-line);border-radius:10px;padding:.6rem .75rem;color:var(--c-ink);font-size:.9rem;outline:none;transition:border-color .15s,box-shadow .15s}
.field:focus{border-color:var(--c-signal);box-shadow:0 0 0 3px color-mix(in srgb,var(--c-signal) 22%,transparent)}
.field::placeholder{color:var(--c-faint)}
label.lbl{display:block;font-size:.72rem;font-weight:500;color:var(--c-muted);margin-bottom:.3rem;letter-spacing:.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border-radius:10px;padding:.55rem .9rem;font-size:.85rem;font-weight:500;transition:all .15s;border:1px solid transparent;cursor:pointer;white-space:nowrap}
.btn-primary{background:var(--c-signal);color:var(--c-on-signal);font-weight:600}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:var(--c-raised);border-color:var(--c-line);color:var(--c-ink)}
.btn-ghost:hover{border-color:var(--c-faint)}
.btn-danger{background:transparent;border-color:var(--c-bad);color:var(--c-bad)}
.btn-danger:hover{background:color-mix(in srgb,var(--c-bad) 14%,transparent)}
.btn:focus-visible,a:focus-visible,button:focus-visible,.field:focus-visible{outline:2px solid var(--c-signal);outline-offset:2px}
.chip{font-family:'JetBrains Mono',monospace;font-size:11px;padding:.3rem .65rem;border-radius:999px;border:1px solid var(--c-line);background:var(--c-raised);color:var(--c-muted);cursor:pointer;white-space:nowrap;transition:all .15s}
.chip:hover{color:var(--c-ink)}
.chip[data-on="1"]{background:var(--c-signal);border-color:var(--c-signal);color:var(--c-on-signal);font-weight:700}
.navitem{display:flex;align-items:center;gap:.7rem;padding:.55rem .7rem;border-radius:10px;font-size:.88rem;color:var(--c-muted);transition:all .13s;border:1px solid transparent;width:100%;text-align:left;cursor:pointer}
.navitem:hover{background:var(--c-raised);color:var(--c-ink)}
.navitem[data-on="1"]{background:var(--c-signal-soft);color:var(--c-signal);border-color:var(--c-line);font-weight:600;box-shadow:inset 2px 0 0 var(--c-signal)}
.navitem i{width:1.1rem;text-align:center;font-size:.9rem}
.sq{width:100%;aspect-ratio:1;border-radius:3px;background:var(--c-raised);border:1px solid var(--c-line)}
.scroll-x{overflow-x:auto;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.thin::-webkit-scrollbar{width:6px;height:6px}
.thin::-webkit-scrollbar-thumb{background:var(--c-line);border-radius:99px}
.appear{animation:appear .22s ease-out both}
@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sheet-in{animation:sheetIn .22s cubic-bezier(.2,.8,.3,1) both}
@keyframes sheetIn{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
.pulse-dot{position:relative}
.pulse-dot::after{content:'';position:absolute;inset:-4px;border-radius:99px;border:1px solid currentColor;opacity:.5;animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{transform:scale(.7);opacity:.6}100%{transform:scale(1.5);opacity:0}}
.bar{height:6px;border-radius:99px;background:var(--c-line);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px;transition:width .4s ease}
.strike{text-decoration:line-through;color:var(--c-faint)}
[contenteditable="true"]:focus{outline:none;box-shadow:0 0 0 2px var(--c-signal);border-radius:5px;padding:0 3px}
.tbl{width:100%;border-collapse:collapse;font-size:.85rem}
.tbl th{text-align:left;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--c-faint);padding:.5rem .6rem;border-bottom:1px solid var(--c-line);font-weight:500}
.tbl td{padding:.6rem;border-bottom:1px solid var(--c-line);vertical-align:middle}
.tbl tbody tr:hover{background:var(--c-raised)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
.section{display:none}
.section[data-on="1"]{display:block}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════
   1. ÉTAT & SCHÉMA
   ═══════════════════════════════════════════════════════════════ */
const VIEW_IDS = ['dashboard','tasks','notes','finance','forecast','planned','settings'];
const LS_DATA = 'mindflow.data.v2';
const LS_CFG  = 'githubConfig';
const LS_UI   = 'mindflow.ui';
const GH_FILE = 'appData.json';

const DEFAULT_CATEGORIES = [
  { id:'work', name:'Travail', color:'#6366F1' },
  { id:'personal', name:'Personnel', color:'#3B82F6' },
  { id:'health', name:'Santé', color:'#10B981' },
  { id:'finance', name:'Finances', color:'#F59E0B' },
  { id:'food', name:'Nourriture', color:'#84CC16' },
  { id:'transport', name:'Transport', color:'#0EA5E9' },
  { id:'housing', name:'Logement', color:'#8B5CF6' },
  { id:'entertainment', name:'Loisirs', color:'#F97316' },
  { id:'recharge', name:'Recharge', color:'#A855F7' },
  { id:'other', name:'Autre', color:'#64748B' },
];
const DEFAULT_ORIGINS = [
  { id:'salary', name:'Salaire', color:'#10B981' },
  { id:'gift', name:'Don', color:'#FCD34D' },
  { id:'freelance', name:'Freelance', color:'#3B82F6' },
  { id:'savings-transfer', name:'Transfert Épargne', color:'#A855F7' },
  { id:'loan-disbursement', name:'Décaissement Prêt', color:'#F97316' },
  { id:'other-income', name:'Autre Revenu', color:'#64748B' },
  { id:'cash', name:'Espèces', color:'#78716C' },
  { id:'bank-card', name:'Carte Bancaire', color:'#4C1D95' },
  { id:'online-payment', name:'Paiement en ligne', color:'#6D28D9' },
  { id:'loan-repayment', name:'Remboursement Prêt', color:'#EF4444' },
];

function blankData(){
  return {
    version:2, meta:{ updatedAt:new Date().toISOString(), device:navigator.userAgent.slice(0,60) },
    todos:[], todoLists:[], notes:[], lists:[], expenses:[], wellness:[],
    categories:DEFAULT_CATEGORIES.map(c=>({...c})), origins:DEFAULT_ORIGINS.map(o=>({...o})),
    loans:[], savings:{ balance:0, transactions:[] }, salaryForecasts:[], plannedExpenses:[],
    habits:[], goals:[], budgets:[], recurring:[],
    settings:{ theme:'dark', currency:'FCFA', start:'dashboard' }
  };
}

let D = blankData();          // données applicatives
let UI = { view:'dashboard', filters:{}, };
let GH = { user:'', repo:'', token:'', branch:'main', sha:null };
let SYNC = { state:'idle', last:null, dirty:false, timer:null, safe:false };  // safe : on connaît l'état du distant

/* ═══════════════════════════════════════════════════════════════
   2. UTILITAIRES
   ═══════════════════════════════════════════════════════════════ */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

const today   = ()=> new Date().toISOString().slice(0,10);
const isoDay  = d => new Date(d).toISOString().slice(0,10);
const addDays = (d,n)=>{ const x=new Date(d+'T12:00:00'); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); };
const monthKey= d => String(d||today()).slice(0,7);
const startOfWeek = (d=today())=>{ const x=new Date(d+'T12:00:00'); const dow=(x.getDay()+6)%7; x.setDate(x.getDate()-dow); return x.toISOString().slice(0,10); };
const daysBetween = (a,b)=> Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);

const MONTHS=['jan','fév','mar','avr','mai','juin','juil','août','sep','oct','nov','déc'];
const DOW=['L','M','M','J','V','S','D'];
function fmtDate(d,long){ if(!d) return '—'; const x=new Date(d+(d.length===10?'T12:00:00':''));
  return long ? `${x.getDate()} ${MONTHS[x.getMonth()]} ${x.getFullYear()}` : `${String(x.getDate()).padStart(2,'0')} ${MONTHS[x.getMonth()]}`; }
function relDay(d){ const n=daysBetween(today(),d);
  if(n===0) return "aujourd'hui"; if(n===1) return 'demain'; if(n===-1) return 'hier';
  return n>0 ? `dans ${n} j` : `il y a ${-n} j`; }

function money(n,{sign=false,compact=false}={}){
  const v=Number(n)||0; const a=Math.abs(v);
  let s = compact && a>=1e6 ? (a/1e6).toFixed(a>=1e7?0:1)+'M'
        : compact && a>=1e4 ? (a/1e3).toFixed(0)+'k'
        : a.toLocaleString('fr-FR',{maximumFractionDigits:0});
  const pre = v<0 ? '−' : (sign&&v>0?'+':'');
  return `${pre}${s} ${D.settings.currency}`;
}
const nf = n => (Number(n)||0).toLocaleString('fr-FR',{maximumFractionDigits:1});

const cat = id => D.categories.find(c=>c.id===id) || { id:'other', name:'Autre', color:'#64748B' };
const org = id => D.origins.find(o=>o.id===id) || { id:'other-income', name:'Autre', color:'#64748B' };

function dot(color,size=8){ return `<span style="width:${size}px;height:${size}px;background:${esc(color)}" class="inline-block rounded-full shrink-0"></span>`; }
function pct(a,b){ return b>0 ? clamp(Math.round(a/b*100),0,999) : 0; }
function download(name, content, type='application/json'){
  const url=URL.createObjectURL(new Blob([content],{type}));
  const a=document.createElement('a'); a.href=url; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

/* ── Toasts ───────────────────────────────────────────────── */
function toast(msg, kind='info', action){
  const colors={info:'var(--c-teal)',ok:'var(--c-good)',warn:'var(--c-signal)',err:'var(--c-bad)'};
  const el=document.createElement('div');
  el.className='pointer-events-auto card card-pad !py-3 flex items-start gap-3 shadow-lg appear';
  el.style.borderLeft=`3px solid ${colors[kind]||colors.info}`;
  el.innerHTML=`<div class="flex-1 text-[13px] leading-snug">${esc(msg)}</div>`;
  if(action){
    const b=document.createElement('button');
    b.className='btn btn-ghost !py-1 !px-2 !text-[11px]'; b.textContent=action.label;
    b.onclick=()=>{ action.fn(); el.remove(); }; el.appendChild(b);
  }
  const x=document.createElement('button'); x.className='text-faint hover:text-ink text-xs'; x.innerHTML='<i class="fas fa-xmark"></i>';
  x.onclick=()=>el.remove(); el.appendChild(x);
  $('#toasts').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, action?7000:3600);
}

/* ═══════════════════════════════════════════════════════════════
   3. PERSISTANCE : local d'abord, GitHub en arrière-plan
   ═══════════════════════════════════════════════════════════════ */
function migrate(raw){
  const d = Object.assign(blankData(), raw||{});
  d.settings = Object.assign(blankData().settings, raw?.settings||{});
  if(d.settings.theme==='light') d.settings.theme='violet';
  if(!['dark','violet','system'].includes(d.settings.theme)) d.settings.theme='dark';
  if(!VIEW_IDS.includes(d.settings.start)) d.settings.start='dashboard';
  d.savings = Object.assign({balance:0,transactions:[]}, raw?.savings||{});
  ['todos','todoLists','notes','lists','expenses','wellness','loans','salaryForecasts',
   'plannedExpenses','habits','goals','budgets','recurring'].forEach(k=>{ if(!Array.isArray(d[k])) d[k]=[]; });
  if(!Array.isArray(d.categories)||!d.categories.length) d.categories=DEFAULT_CATEGORIES.map(c=>({...c}));
  if(!Array.isArray(d.origins)||!d.origins.length) d.origins=DEFAULT_ORIGINS.map(o=>({...o}));
  // anciennes tâches à plat -> liste dédiée
  if(d.todos.length){
    let bag=d.todoLists.find(l=>l.id==='legacy-inbox');
    if(!bag){ bag={id:'legacy-inbox',title:'Boîte de réception',description:'Tâches importées de l’ancienne version',tasks:[],createdAt:new Date().toISOString()}; d.todoLists.unshift(bag); }
    d.todos.forEach(t=>bag.tasks.push({id:t.id||uid(),text:t.text||t.title||'Tâche',priority:t.priority||'medium',
      completed:!!t.completed,dueDate:t.dueDate||null,createdAt:t.createdAt||new Date().toISOString()}));
    d.todos=[];
  }
  d.todoLists.forEach(l=>{ l.tasks=Array.isArray(l.tasks)?l.tasks:[];
    l.tasks.forEach(t=>{ t.id=t.id||uid(); t.priority=t.priority||'medium'; t.tags=t.tags||[]; });});
  d.notes.forEach(n=>{ n.tags=n.tags||[]; n.pinned=!!n.pinned; });
  d.habits.forEach(h=>{ h.log=h.log||{}; });
  d.version=2;
  return d;
}

function saveLocal(){
  D.meta = { ...(D.meta||{}), updatedAt:new Date().toISOString() };
  try{ localStorage.setItem(LS_DATA, JSON.stringify(D)); }catch(e){ console.warn('localStorage plein',e); }
}
function saveUI(){ try{ localStorage.setItem(LS_UI, JSON.stringify({view:UI.view,theme:D.settings.theme})); }catch(e){} }

/** Point d'entrée unique après toute modification. */
function commit(opts={}){
  saveLocal();
  SYNC.dirty = true; renderSyncPill();
  if(GH.token) scheduleSync();
  if(opts.render!==false) render();
}

function scheduleSync(){
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(()=>pushToGitHub(), 2500);
}

function setSync(state,msg){ SYNC.state=state; SYNC.msg=msg||''; renderSyncPill(); }
function renderSyncPill(){
  const dot=$('#syncDot'), lbl=$('#syncLabel'); if(!dot) return;
  const map={
    idle:   [SYNC.dirty?'var(--c-signal)':'var(--c-good)', SYNC.dirty?'à envoyer':'à jour'],
    busy:   ['var(--c-teal)','synchro…'],
    error:  ['var(--c-bad)','erreur'],
    off:    ['var(--c-faint)','local'],
  };
  const [c,t]=map[GH.token?SYNC.state:'off']||map.off;
  dot.style.background=c; dot.classList.toggle('pulse-dot',SYNC.state==='busy'); dot.style.color=c;
  lbl.textContent=t; lbl.style.color=c;
}

function ghUrl(){ return `https://api.github.com/repos/${GH.user}/${GH.repo}/contents/${GH_FILE}`; }
function ghHeaders(){ return { 'Authorization':`token ${GH.token}`, 'Accept':'application/vnd.github+json' }; }
function b64encode(str){
  const bytes=new TextEncoder().encode(str); let bin='';
  const CH=0x8000; for(let i=0;i<bytes.length;i+=CH) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
  return btoa(bin);
}
function b64decode(b64){
  const bin=atob(b64.replace(/\n/g,''));
  return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)));
}

async function pullFromGitHub({silent=false}={}){
  if(!GH.token||!GH.user||!GH.repo) return null;
  setSync('busy');
  try{
    const r = await fetch(ghUrl(), { headers:ghHeaders(), cache:'no-store' });
    if(r.status===404){ SYNC.safe=true; setSync('idle'); if(!silent) toast('Aucun fichier distant : il sera créé à la première synchro.','warn'); return null; }
    if(!r.ok) throw new Error((await r.json()).message||r.status);
    const j = await r.json(); GH.sha=j.sha;
    const remote = migrate(JSON.parse(b64decode(j.content)));
    SYNC.safe=true; setSync('idle'); SYNC.last=new Date();
    return remote;
  }catch(e){ setSync('error'); if(!silent) toast('Lecture GitHub impossible : '+e.message,'err'); return null; }
}

async function pushToGitHub(force=false){
  if(!GH.token||!GH.user||!GH.repo){ setSync('off'); return false; }
  if(!SYNC.safe && !force){
    setSync('error');
    toast("Envoi suspendu : le fichier distant n'a pas pu être lu. Rien ne sera écrasé.",'warn',
      {label:'Envoyer quand même',fn:()=>pushToGitHub(true)});
    return false;
  }
  setSync('busy');
  try{
    if(!GH.sha){
      const head=await fetch(ghUrl(),{headers:ghHeaders(),cache:'no-store'});
      if(head.ok) GH.sha=(await head.json()).sha; else if(head.status!==404) throw new Error('HTTP '+head.status);
    }
    const body={ message:`MindFlow — ${new Date().toLocaleString('fr-FR')}`, content:b64encode(JSON.stringify(D,null,2)), branch:GH.branch||'main' };
    if(GH.sha) body.sha=GH.sha;
    let r = await fetch(ghUrl(),{ method:'PUT', headers:{...ghHeaders(),'Content-Type':'application/json'}, body:JSON.stringify(body) });
    if(r.status===409 || r.status===422){            // sha périmé → on relit et on repousse
      const head=await fetch(ghUrl(),{headers:ghHeaders(),cache:'no-store'});
      if(head.ok){ GH.sha=(await head.json()).sha; body.sha=GH.sha;
        r = await fetch(ghUrl(),{ method:'PUT', headers:{...ghHeaders(),'Content-Type':'application/json'}, body:JSON.stringify(body) }); }
    }
    if(!r.ok) throw new Error((await r.json()).message||r.status);
    GH.sha=(await r.json()).content.sha;
    SYNC.safe=true; SYNC.dirty=false; SYNC.last=new Date(); setSync('idle');
    return true;
  }catch(e){ setSync('error'); toast('Sauvegarde GitHub échouée : '+e.message,'err',{label:'Réessayer',fn:()=>pushToGitHub(true)}); return false; }
}

async function bootData(){
  const local = localStorage.getItem(LS_DATA);
  if(local){ try{ D = migrate(JSON.parse(local)); }catch(e){ D=blankData(); } }
  applyTheme(D.settings.theme);
  const cfg = localStorage.getItem(LS_CFG);
  if(cfg){ try{ const c=JSON.parse(cfg); GH={ user:c.username||c.user||'', repo:c.repo||'', token:c.token||'', branch:c.branch||'main', sha:null }; }catch(e){} }
  render();                                   // affichage immédiat, sans attendre le réseau
  if(GH.token){
    const remote = await pullFromGitHub({silent:true});
    if(remote){
      const rT = new Date(remote.meta?.updatedAt||0).getTime();
      const lT = new Date(D.meta?.updatedAt||0).getTime();
      const localEmpty = !local;
      if(localEmpty || rT > lT){ D=remote; saveLocal(); toast('Données récupérées depuis GitHub.','ok'); }
      else if(lT > rT){ SYNC.dirty=true; scheduleSync(); }
      render();
    }
  } else if(!local){
    setTimeout(()=>openSettings('sync'), 400);
  }
  runAutomations();
}

/* ── Automatismes : dépenses récurrentes + tâches récurrentes ── */
function runAutomations(){
  let changed=false;
  (D.recurring||[]).filter(r=>r.active!==false).forEach(r=>{
    const start = r.lastRun ? addDays(r.lastRun,1) : monthKey()+'-01';
    let cur = start, guard=0;
    while(cur<=today() && guard++<400){
      const day = Number(cur.slice(8,10));
      if(day===Number(r.day)){
        const exists=D.expenses.some(e=>e.recurringId===r.id && e.date===cur);
        if(!exists){
          D.expenses.push({ id:uid(), date:cur, description:r.description, category:r.category,
            origin:r.origin, amount:r.type==='income'?Math.abs(r.amount):-Math.abs(r.amount),
            recurringId:r.id, createdAt:new Date().toISOString() });
          changed=true;
        }
      }
      cur=addDays(cur,1);
    }
    r.lastRun=today();
  });
  D.todoLists.forEach(l=>l.tasks.forEach(t=>{
    if(t.completed && t.recurrence && t.completedAt){
      const step={daily:1,weekly:7,monthly:30}[t.recurrence]||0;
      if(step && daysBetween(isoDay(t.completedAt), today())>=step){
        t.completed=false; t.completedAt=null;
        if(t.dueDate) t.dueDate=addDays(t.dueDate,step);
        changed=true;
      }
    }
  }));
  if(changed){ saveLocal(); if(GH.token) scheduleSync(); toast('Écritures récurrentes générées.','info'); }
}

let modalStack=[];
function closeModal(){ modalStack.pop(); if(!modalStack.length){ $('#modalRoot').classList.add('hidden'); $('#modalBox').innerHTML=''; } }
function openModal(html,{onMount}={}){

/** Formulaire déclaratif. fields:[{key,label,type,...}] */
function openForm({title,subtitle,fields,values={},submitLabel='Enregistrer',danger,onSubmit,onDelete,after,deleteLabel='Supprimer'}){
  const body = `<form id="dynForm" class="space-y-3.5">
      ${fields.map(f=>fieldHtml(f, values[f.key])).join('')}
      <div class="flex gap-2 pt-2">
        ${onDelete?`<button type="button" id="dynDelete" class="btn btn-danger"><i class="fas fa-trash text-[11px]"></i>${esc(deleteLabel)}</button>`:''}
        <button type="button" data-close class="btn btn-ghost ml-auto">Annuler</button>
        <button type="submit" class="btn ${danger?'btn-danger':'btn-primary'}">${esc(submitLabel)}</button>
      </div></form>`;
  openModal(modalShell(title,body,{subtitle}),{ onMount(box){
    fields.forEach(f=>mountField(f,box,values[f.key]));
    box.querySelector('#dynForm').addEventListener('submit',e=>{
      e.preventDefault();
      const out={}; let bad=null;
      fields.forEach(f=>{ const v=readField(f,box); out[f.key]=v;
        if(f.required && (v===''||v===null||v===undefined||(Array.isArray(v)&&!v.length))) bad=bad||f.label; });
      if(bad){ toast(`« ${bad} » est obligatoire.`,'warn'); return; }
      closeModal(); onSubmit(out);
    });
    const del=box.querySelector('#dynDelete');
    if(del) del.onclick=()=>{ closeModal(); onDelete(); };
    after&&after(box);
  }});
}

function fieldHtml(f,val){
  const id='f_'+f.key;
  const lab = f.type==='checkbox' ? '' : `<label class="lbl" for="${id}">${esc(f.label)}${f.required?' <span style="color:var(--c-signal)">*</span>':''}</label>`;
  let inner='';
  switch(f.type){
    case 'textarea': inner=`<textarea id="${id}" rows="${f.rows||4}" class="field" placeholder="${esc(f.placeholder||'')}">${esc(val??f.default??'')}</textarea>`; break;
    case 'number':   inner=`<input id="${id}" type="number" step="${f.step||'any'}" ${f.min!=null?`min="${f.min}"`:''} class="field num" placeholder="${esc(f.placeholder||'')}" value="${val??f.default??''}">`; break;
    case 'date':     inner=`<input id="${id}" type="date" class="field num" value="${val??f.default??''}">`; break;
    case 'color':    inner=`<input id="${id}" type="color" class="field h-10 p-1 cursor-pointer" value="${val??f.default??'#8B5CF6'}">`; break;
    case 'select':   inner=`<select id="${id}" class="field">${(typeof f.options==='function'?f.options():f.options).map(o=>
                       `<option value="${esc(o.value)}" ${String(val??f.default)===String(o.value)?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`; break;
    case 'checkbox': inner=`<label class="flex items-center gap-2.5 cursor-pointer select-none py-1">
                       <input id="${id}" type="checkbox" class="w-4 h-4 accent-[var(--c-signal)]" ${(val??f.default)?'checked':''}>
                       <span class="text-sm">${esc(f.label)}</span></label>`; break;
    case 'segment':  inner=`<div id="${id}" class="flex gap-1.5 flex-wrap" data-seg>${f.options.map(o=>
                       `<button type="button" class="chip" data-v="${esc(o.value)}" data-on="${String(val??f.default)===String(o.value)?1:0}">${esc(o.label)}</button>`).join('')}</div>`; break;
    case 'mood':     inner=`<div id="${id}" class="flex justify-between gap-1" data-mood>${
                       [['1','face-frown','var(--c-bad)'],['2','face-meh','#EAB308'],['3','face-smile','var(--c-good)'],['4','face-laugh','var(--c-teal)'],['5','face-grin-hearts','var(--c-violet)']]
                       .map(([v,ic,c])=>`<button type="button" data-v="${v}" data-c="${c}" class="flex-1 py-2.5 rounded-lg border hair transition" style="${String(val)===v?`background:${c};color:#fff;border-color:${c}`:`color:${c}`}"><i class="fas fa-${ic} text-lg"></i></button>`).join('')}</div>`; break;
    case 'tags':     inner=`<input id="${id}" class="field" placeholder="${esc(f.placeholder||'séparés par des virgules')}" value="${esc((val||[]).join(', '))}">`; break;
    case 'repeater': inner=`<div id="${id}" class="space-y-2"></div>
                       <button type="button" data-add="${id}" class="text-[12px] mt-2 flex items-center gap-1.5" style="color:var(--c-signal)"><i class="fas fa-plus text-[10px]"></i>${esc(f.addLabel||'Ajouter une ligne')}</button>
                       ${f.totalLabel?`<div class="mt-2.5 px-3 py-2 rounded-lg bg-raised border hair flex justify-between text-[12px]"><span class="text-muted">${esc(f.totalLabel)}</span><b class="num" data-total="${id}">0</b></div>`:''}`; break;
    case 'static':   inner=`<div class="text-sm text-muted">${f.html||''}</div>`; break;
    default:         inner=`<input id="${id}" type="text" class="field" placeholder="${esc(f.placeholder||'')}" value="${esc(val??f.default??'')}">`;
  }
  return `<div data-fw="${f.key}">${lab}${inner}${f.hint?`<p class="text-[11px] text-faint mt-1.5">${f.hint}</p>`:''}</div>`;
}

function mountField(f,box,val){
  const el=box.querySelector('#f_'+f.key); if(!el) return;
  if(f.type==='segment'||f.type==='mood'){
    el.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      el.querySelectorAll('button').forEach(x=>{
        if(f.type==='segment') x.dataset.on='0';
        else { x.style.background='transparent'; x.style.color=x.dataset.c||''; }
      });
      if(f.type==='segment') b.dataset.on='1';
      else { el.querySelectorAll('button').forEach(x=>{ x.style.background='transparent'; x.style.borderColor=''; x.style.color=x.dataset.c||''; });
             b.style.background=b.dataset.c||'var(--c-signal)'; b.style.color='#fff'; b.style.borderColor=b.dataset.c||'var(--c-signal)'; }
      el.dataset.value=b.dataset.v; f.onChange&&f.onChange(b.dataset.v,box);
    });
    el.dataset.value = val ?? f.default ?? (f.options?.[0]?.value||'');
  }
  if(f.type==='repeater'){
    const add=(row={})=>{
      const line=document.createElement('div');
      line.className='flex items-center gap-1.5'; line.dataset.row='1';
      line.innerHTML = f.itemFields.map(it=>{
        if(it.type==='checkbox') return `<input type="checkbox" data-k="${it.key}" class="w-4 h-4 accent-[var(--c-signal)] shrink-0" ${row[it.key]?'checked':''} title="${esc(it.label||'')}">`;
        if(it.type==='number')   return `<input type="number" step="any" data-k="${it.key}" class="field num !py-1.5 w-28 shrink-0" placeholder="${esc(it.label||'')}" value="${row[it.key]??''}">`;
        return `<input type="text" data-k="${it.key}" class="field !py-1.5 flex-1 min-w-0" placeholder="${esc(it.label||'')}" value="${esc(row[it.key]??'')}">`;
      }).join('') + `<button type="button" data-rm class="text-faint hover:text-[var(--c-bad)] px-1 shrink-0"><i class="fas fa-xmark text-xs"></i></button>`;
      line.querySelector('[data-rm]').onclick=()=>{ line.remove(); upd(); };
      line.querySelectorAll('input').forEach(i=>i.addEventListener('input',upd));
      el.appendChild(line);
    };
    const upd=()=>{ const t=box.querySelector(`[data-total="f_${f.key}"]`); if(!t) return;
      let s=0; el.querySelectorAll('[data-row]').forEach(r=>{ const n=r.querySelector('[data-k="amount"]'); if(n) s+=parseFloat(n.value)||0; });
      t.textContent=money(s); f.onTotal&&f.onTotal(s,box); };
    (val&&val.length?val:(f.seed?[{}]:[])).forEach(r=>add(r));
    box.querySelector(`[data-add="f_${f.key}"]`).onclick=()=>{ add({}); upd(); };
    upd();
  }
}

function readField(f,box){
  const el=box.querySelector('#f_'+f.key); if(!el) return null;
  switch(f.type){
    case 'number': return el.value===''?null:parseFloat(el.value);
    case 'checkbox': return el.checked;
    case 'segment': case 'mood': return el.dataset.value||null;
    case 'tags': return el.value.split(',').map(s=>s.trim()).filter(Boolean);
    case 'repeater': return Array.from(el.querySelectorAll('[data-row]')).map(r=>{
        const o={}; f.itemFields.forEach(it=>{ const i=r.querySelector(`[data-k="${it.key}"]`);
          o[it.key]= it.type==='checkbox'? i.checked : it.type==='number' ? (parseFloat(i.value)||0) : i.value.trim(); });
        return o;
      }).filter(o=>f.itemFields.some(it=>it.type!=='checkbox' && o[it.key]!=='' && o[it.key]!==0));
    case 'static': return null;
    default: return el.value.trim ? el.value.trim() : el.value;
  }
}

   6. SÉLECTEURS MÉTIER
   ═══════════════════════════════════════════════════════════════ */
const allTasks = ()=> D.todoLists.flatMap(l=>l.tasks.map(t=>({...t,listId:l.id,listTitle:l.title})));
const openTasks = ()=> allTasks().filter(t=>!t.completed);
const overdueTasks = ()=> openTasks().filter(t=>t.dueDate && t.dueDate<today());
const dueTodayTasks = ()=> openTasks().filter(t=>t.dueDate===today());

const incomes  = (l=D.expenses)=> l.filter(e=>e.amount>0);
const outflows = (l=D.expenses)=> l.filter(e=>e.amount<0);
const balance  = ()=> D.expenses.reduce((s,e)=>s+e.amount,0);
const loansLeft= ()=> D.loans.reduce((s,l)=>s+Math.max(0,(l.amount||0)-(l.paid||0)),0);
const netWorth = ()=> balance()+ (D.savings.balance||0) - loansLeft();

function inRange(e,range){
  const d=e.date||''; if(range==='all') return true;
  if(range==='thisMonth') return d.startsWith(monthKey());
  if(range==='lastMonth'){ const m=new Date(); m.setMonth(m.getMonth()-1); return d.startsWith(m.toISOString().slice(0,7)); }
  if(range==='thisWeek') return d>=startOfWeek();
  if(range==='thisYear') return d.startsWith(String(new Date().getFullYear()));
  if(range==='30d') return d>=addDays(today(),-30);
  return true;
}
function spentByCategory(range='thisMonth'){
  const m={};
  outflows().filter(e=>inRange(e,range)).forEach(e=>{ m[e.category]=(m[e.category]||0)+Math.abs(e.amount); });
  return Object.entries(m).map(([id,v])=>({id,name:cat(id).name,color:cat(id).color,value:v})).sort((a,b)=>b.value-a.value);
}
function monthlySeries(n=6){
  const out=[]; const now=new Date();
  for(let i=n-1;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); const k=d.toISOString().slice(0,7);
    const rows=D.expenses.filter(e=>(e.date||'').startsWith(k));
    out.push({ key:k, label:MONTHS[d.getMonth()], in:incomes(rows).reduce((s,e)=>s+e.amount,0),
               out:outflows(rows).reduce((s,e)=>s+Math.abs(e.amount),0) });
  }
  return out;
}

const charts={};
const cvar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function chart(id,cfg){
  const el=document.getElementById(id); if(!el||!window.Chart) return;
  charts[id]&&charts[id].destroy();
  const css=getComputedStyle(document.documentElement);
  const line=css.getPropertyValue('--c-line').trim(), muted=css.getPropertyValue('--c-muted').trim();
  Chart.defaults.font.family="'JetBrains Mono',monospace"; Chart.defaults.font.size=10; Chart.defaults.color=muted;
  cfg.options=Object.assign({responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:false},tooltip:{backgroundColor:css.getPropertyValue('--c-surface').trim(),
      borderColor:line,borderWidth:1,titleColor:css.getPropertyValue('--c-ink').trim(),bodyColor:muted,padding:10,cornerRadius:8,displayColors:true}},
  },cfg.options||{});
  if(cfg.options.scales) for(const k in cfg.options.scales){
    cfg.options.scales[k]=Object.assign({grid:{color:line,drawTicks:false},border:{display:false},ticks:{padding:6}},cfg.options.scales[k]);
  }
  charts[id]=new Chart(el,cfg);
}

  if(f==='week') return !t.completed && t.dueDate && t.dueDate<=addDays(today(),7);
  if(f==='late') return !t.completed && t.dueDate && t.dueDate<today();

const catOptions = ()=> D.categories.map(c=>({value:c.id,label:c.name}));
const orgOptions = ()=> D.origins.map(o=>({value:o.id,label:o.name}));
const listOptions= ()=> D.todoLists.map(l=>({value:l.id,label:l.title}));

const ACTIONS = {
  /* ── navigation ── */
  goFinance:()=>go('finance'), goTasks:()=>go('tasks'), goNotes:()=>go('notes'),

  /* ── tâches ── */
  filterTasks:d=>{ UI.filters.tasks=d.v; render(); },
  newList:()=>openForm({ title:'Nouvelle liste', subtitle:'un contexte, un paquet de tâches',
    fields:[{key:'title',label:'Titre',type:'text',required:true,placeholder:'Ex. Audit IGPM'},
            {key:'description',label:'Description',type:'textarea',rows:2}],
    onSubmit:v=>{ D.todoLists.push({id:uid(),title:v.title,description:v.description,tasks:[],createdAt:new Date().toISOString()}); commit(); toast('Liste créée.','ok'); }}),
  editList:d=>{ const l=D.todoLists.find(x=>x.id===d.id); if(!l) return;
    openForm({ title:'Modifier la liste', values:l,
      fields:[{key:'title',label:'Titre',type:'text',required:true},{key:'description',label:'Description',type:'textarea',rows:2}],
      onDelete:()=>confirmAction(`Supprimer « ${esc(l.title)} » et ses ${l.tasks.length} tâches ?`,{onOk:()=>{
        D.todoLists=D.todoLists.filter(x=>x.id!==l.id); commit(); toast('Liste supprimée.','ok'); }}),
      onSubmit:v=>{ Object.assign(l,{title:v.title,description:v.description}); commit(); }}); },
  newTask:d=>openTaskForm(null,d.id),
  editTask:d=>{ const l=D.todoLists.find(x=>x.id===d.list); openTaskForm(l?.tasks.find(t=>t.id===d.id)||null,d.list); },
  toggleTask:d=>{ const l=D.todoLists.find(x=>x.id===d.list); const t=l?.tasks.find(x=>x.id===d.id); if(!t) return;
    t.completed=!t.completed; t.completedAt=t.completed?new Date().toISOString():null; commit(); },


  /* ── notes ── */
  newNote:()=>openNoteForm(null),
  editNote:d=>openNoteForm(D.notes.find(n=>n.id===d.id)),
  newCheckList:()=>openCheckListForm(null),
  editCheckList:d=>openCheckListForm(D.lists.find(l=>l.id===d.id)),
  toggleListItem:d=>{ const l=D.lists.find(x=>x.id===d.id); if(!l) return;
    const it=l.items[Number(d.ix)]; it.completed=!it.completed; commit({render:false}); },

  /* ── finances ── */
  finRange:d=>{ UI.filters.fin.range=d.v; render(); },
  finType: d=>{ UI.filters.fin.type=d.v; render(); },
  newExpense:()=>openExpenseForm(null),
  editExpense:d=>openExpenseForm(D.expenses.find(e=>e.id===d.id)),
  delExpense:d=>{ const e=D.expenses.find(x=>x.id===d.id); if(!e) return;
    const snap=JSON.parse(JSON.stringify(e));
    D.expenses=D.expenses.filter(x=>x.id!==d.id); commit();
    toast('Opération supprimée.','ok',{label:'Annuler',fn:()=>{ D.expenses.push(snap); commit(); }}); },
  newIncome:()=>openForm({ title:'Ajouter un revenu', submitLabel:'Ajouter',
    fields:[{key:'date',label:'Date',type:'date',default:today(),required:true},
            {key:'description',label:'Description',type:'text',required:true,placeholder:'Salaire août'},
            {key:'origin',label:'Provenance',type:'select',options:orgOptions,default:'salary'},
            {key:'amount',label:'Montant',type:'number',required:true,min:0}],
    onSubmit:v=>{ D.expenses.push({id:uid(),date:v.date,description:v.description,category:'finance',
      origin:v.origin,amount:Math.abs(v.amount),createdAt:new Date().toISOString()}); commit(); toast('Revenu enregistré.','ok'); }}),
  newLoan:()=>openLoanForm(null),
  editLoan:d=>openLoanForm(D.loans.find(l=>l.id===d.id)),
  repayLoan:d=>{ const l=D.loans.find(x=>x.id===d.id); if(!l) return;
    const left=l.amount-l.paid;

          category:v.category,origin:v.origin,amount:-Math.abs(it.amount),createdAt:new Date().toISOString()});
        commit(); toast('Poste réglé.','ok'); }}); },

  setTheme:d=>{ D.settings.theme=d.v; applyTheme(d.v); commit(); },

  saveGh:()=>{ GH.user=$('#ghUser').value.trim(); GH.repo=$('#ghRepo').value.trim();

    localStorage.setItem(LS_CFG,JSON.stringify({username:GH.user,repo:GH.repo,token:GH.token,branch:GH.branch}));
    renderSyncPill(); toast('Configuration enregistrée.','ok');
    if(GH.token) pullFromGitHub({silent:true}).then(r=>{

      else pushToGitHub(true); }); },
  pullGh:async()=>{ const r=await pullFromGitHub(); if(r){ D=r; saveLocal(); render(); toast('Données distantes chargées.','ok'); } },
  pushGh:async()=>{ if(await pushToGitHub(true)) toast('Données envoyées sur GitHub.','ok'); },

  exportCsv:()=>{ const rows=finFiltered();

function openTaskForm(task,listId){
  const isNew=!task;
  openForm({ title:isNew?'Nouvelle tâche':'Modifier la tâche',
    values:task||{priority:'medium',listId},
    fields:[
      {key:'text',label:'Intitulé',type:'text',required:true,placeholder:'Que faut-il faire ?'},
      {key:'listId',label:'Liste',type:'select',options:listOptions,default:listId},
      {key:'priority',label:'Priorité',type:'segment',options:[{value:'low',label:'Basse'},{value:'medium',label:'Moyenne'},{value:'high',label:'Haute'}],default:'medium'},
      {key:'dueDate',label:'Échéance',type:'date'},
      {key:'recurrence',label:'Répétition',type:'select',default:'',
        options:[{value:'',label:'Aucune'},{value:'daily',label:'Chaque jour'},{value:'weekly',label:'Chaque semaine'},{value:'monthly',label:'Chaque mois'}]},
      {key:'tags',label:'Étiquettes',type:'tags'},
    ],
    onDelete:isNew?null:()=>{ const l=D.todoLists.find(x=>x.id===listId); l.tasks=l.tasks.filter(t=>t.id!==task.id); commit(); toast('Tâche supprimée.','ok'); },
    onSubmit:v=>{
      const target=D.todoLists.find(l=>l.id===v.listId)||D.todoLists[0]; if(!target){ toast('Crée d’abord une liste.','warn'); return; }
      if(isNew){ target.tasks.push({id:uid(),text:v.text,priority:v.priority,dueDate:v.dueDate||null,
        recurrence:v.recurrence||null,tags:v.tags,completed:false,createdAt:new Date().toISOString()}); }
      else { const src=D.todoLists.find(l=>l.id===listId);
        if(src&&src!==target){ src.tasks=src.tasks.filter(t=>t.id!==task.id); target.tasks.push(task); }
        Object.assign(task,{text:v.text,priority:v.priority,dueDate:v.dueDate||null,recurrence:v.recurrence||null,tags:v.tags}); }
      commit(); }});
}

function openTermForm(kind,item){
  const isNew=!item; const label=kind==='categories'?'catégorie':'provenance';
  openForm({ title:isNew?`Nouvelle ${label}`:`Modifier la ${label}`, values:item||{color:'#64748B'},
    fields:[{key:'name',label:'Nom',type:'text',required:true},{key:'color',label:'Couleur',type:'color',default:'#64748B'}],
    onDelete:isNew?null:()=>{
      const used = kind==='categories' ? D.expenses.filter(e=>e.category===item.id).length
                                       : D.expenses.filter(e=>e.origin===item.id).length;
      confirmAction(used?`${used} opération(s) utilisent cette ${label}. Elles basculeront sur « Autre ».`:`Supprimer cette ${label} ?`,
        {onOk:()=>{ if(kind==='categories'){ D.expenses.forEach(e=>{ if(e.category===item.id) e.category='other'; });
            D.categories=D.categories.filter(c=>c.id!==item.id); }
          else { D.expenses.forEach(e=>{ if(e.origin===item.id) e.origin='other-income'; }); D.origins=D.origins.filter(o=>o.id!==item.id); }
          commit(); }}); },
    onSubmit:v=>{ const arr=D[kind]; const newId=v.name.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');
      if(isNew){ if(arr.some(x=>x.id===newId)){ toast('Ce nom existe déjà.','warn'); return; }
        arr.push({id:newId,name:v.name,color:v.color}); }
      else { const old=item.id;
        if(old!==newId){ if(arr.some(x=>x.id===newId)){ toast('Ce nom existe déjà.','warn'); return; }
          if(kind==='categories') D.expenses.forEach(e=>{ if(e.category===old) e.category=newId; });
          else D.expenses.forEach(e=>{ if(e.origin===old) e.origin=newId; });
        }
        Object.assign(item,{id:newId,name:v.name,color:v.color}); }
      commit(); }});
}

function pdfDoc(title,subtitle){
  const { jsPDF } = window.jspdf;
  const doc=new jsPDF({unit:'pt',format:'a4'});
  doc.setFillColor(12,10,20); doc.rect(0,0,595,72,'F');
  doc.setTextColor(139,123,255); doc.setFont('helvetica','bold'); doc.setFontSize(17); doc.text('MindFlow',40,36);
  doc.setTextColor(200,210,220); doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.text(title.toUpperCase(),40,52);
  doc.setFontSize(8); doc.setTextColor(140,155,170);
  doc.text(subtitle||new Date().toLocaleString('fr-FR'),555,52,{align:'right'});
  return doc;
}
const TBL_STYLE={ theme:'grid', styles:{fontSize:8,cellPadding:4,lineColor:[225,229,228],textColor:[20,28,36]},
  headStyles:{fillColor:[30,22,51],textColor:[196,181,253],fontSize:8}, alternateRowStyles:{fillColor:[248,249,250]} };
function kpiBlock(doc,y,pairs){
  doc.setFontSize(9);
  pairs.forEach((p,i)=>{ const x=40+(i%3)*172;
    if(i%3===0&&i>0) y+=42;
    doc.setTextColor(120,130,140); doc.text(p[0],x,y);
    doc.setTextColor(20,28,36); doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text(String(p[1]),x,y+16);
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
  });
  return y+40;
}
function exportFinancePdf(){
  const rows=finFiltered();
  const doc=pdfDoc('Relevé financier',`${rows.length} opérations`);
  let y=kpiBlock(doc,100,[['Solde',money(balance())],['Épargne',money(D.savings.balance||0)],['Dettes',money(loansLeft())]]);
  doc.autoTable({ ...TBL_STYLE, startY:y+8,
    head:[['Date','Description','Catégorie','Provenance','Montant']],
    body:rows.map(e=>[fmtDate(e.date),e.description,cat(e.category).name,org(e.origin).name,money(e.amount,{sign:true})]),
    columnStyles:{4:{halign:'right'}} });
  const cs=spentByCategory(UI.filters.fin.range);
  if(cs.length) doc.autoTable({ ...TBL_STYLE, startY:doc.lastAutoTable.finalY+18,
    head:[['Catégorie','Dépensé','Part']], body:cs.map(c=>[c.name,money(c.value),
      Math.round(c.value/cs.reduce((s,x)=>s+x.value,0)*100)+'%']), columnStyles:{1:{halign:'right'},2:{halign:'right'}} });
  doc.save(`mindflow-finances-${today()}.pdf`);
  toast('Relevé PDF généré.','ok');
}
function exportFullPdf(){
  const doc=pdfDoc('Rapport complet');
  let y=kpiBlock(doc,100,[['Solde',money(balance())],['Épargne',money(D.savings.balance||0)],['Patrimoine net',money(netWorth())],
    ['Dettes',money(loansLeft())],['Tâches en cours',String(openTasks().length)],['En retard',String(overdueTasks().length)]]);
  const t=allTasks().filter(x=>!x.completed);
  if(t.length) doc.autoTable({ ...TBL_STYLE, startY:y+10, head:[['Tâche','Liste','Priorité','Échéance']],
    body:t.map(x=>[x.text,x.listTitle,(PRIO[x.priority]||PRIO.medium).label,x.dueDate?fmtDate(x.dueDate,true):'—']) });
  doc.save(`mindflow-rapport-${today()}.pdf`);
  toast('Rapport PDF généré.','ok');
}

function closePalette(){ $('#paletteRoot').classList.add('hidden'); }
function paletteSearch(q){
  const s=q.trim().toLowerCase();
  const hit=x=>!s||String(x).toLowerCase().includes(s);
  const res=[];
  COMMANDS.filter(c=>hit(c.label)).slice(0,s?4:6).forEach(c=>res.push({...c,kind:'Action'}));
  if(s){
    allTasks().filter(t=>hit(t.text)).slice(0,5).forEach(t=>res.push({label:t.text,sub:t.listTitle,icon:'list-check',kind:'Tâche',
      run:()=>{ go('tasks'); setTimeout(()=>openTaskForm(t,t.listId),120); }}));
    D.notes.filter(n=>hit(n.title)||hit(n.content)).slice(0,5).forEach(n=>res.push({label:n.title||'Sans titre',sub:'note',icon:'note-sticky',kind:'Note',
      run:()=>{ go('notes'); setTimeout(()=>openNoteForm(n),120); }}));
    D.expenses.filter(e=>hit(e.description)).slice(0,6).forEach(e=>res.push({label:e.description,sub:`${fmtDate(e.date)} · ${money(e.amount,{sign:true})}`,
      icon:'receipt',kind:'Opération',run:()=>{ go('finance'); setTimeout(()=>openExpenseForm(e),120); }}));
  }
  $('#paletteResults').innerHTML = res.length? res.map((r,ix)=>`
    <button class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-raised text-left transition" data-ix="${ix}">
      <i class="fas fa-${r.icon} text-[11px] w-4 text-center text-faint"></i>
      <span class="flex-1 min-w-0"><span class="block text-[13px] truncate">${esc(r.label)}</span>
      ${r.sub?`<span class="eyebrow">${esc(r.sub)}</span>`:''}</span>
      <span class="eyebrow">${r.kind}</span></button>`).join('')
    : `<p class="text-[12px] text-muted text-center py-8">Aucun résultat pour « ${esc(q)} ».</p>`;
  $$('#paletteResults [data-ix]').forEach(b=>b.onclick=()=>{ closePalette(); res[Number(b.dataset.ix)].run(); });
  return res;
}

/* ═══════════════════════════════════════════════════════════════
   22. THÈME, RACCOURCIS, DÉMARRAGE
   ═══════════════════════════════════════════════════════════════ */
const mq = q => (window.matchMedia ? window.matchMedia(q) : { matches:false, addEventListener(){}, addListener(){} });
function applyTheme(pref){
  const sysDark = mq('(prefers-color-scheme: dark)').matches;
  const dark = pref==='dark' || (pref==='system' && sysDark);
  document.documentElement.classList.toggle('dark',dark);
  document.querySelector('meta[name=theme-color]').setAttribute('content',dark?'#0C0A14':'#F3F0FB');
  const ic=$('#btnTheme')?.querySelector('i'); if(ic) ic.className=`fas fa-${dark?'palette':'moon'} text-xs`;
  Object.values(charts).forEach(c=>c&&c.destroy()); 
  if(document.getElementById('views')?.innerHTML) (AFTER[UI.view]||[]).forEach(f=>f());
}
mq('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(D.settings.theme==='system') applyTheme('system'); });

function quickAddMenu(){
  const opts=[['Dépense','plus','newExpense'],['Revenu','arrow-down','newIncome'],['Tâche','list-check','__task'],
    ['Note','note-sticky','newNote'],['Liste','list-ul','newCheckList'],['Prêt','hand-holding-dollar','newLoan'],
    ['Prévision','money-bill-trend-up','newForecast'],['Dépense prévue','clipboard-list','newPlanned']];
  openModal(modalShell('Ajouter','<div class="grid grid-cols-2 gap-2">'+opts.map(([l,i,a])=>
    `<button class="btn btn-ghost !justify-start !py-3" data-qa="${a}"><i class="fas fa-${i} text-[11px]"></i>${l}</button>`).join('')+'</div>'),
    {onMount(box){ box.querySelectorAll('[data-qa]').forEach(b=>b.onclick=()=>{ const a=b.dataset.qa; closeModal();
      if(a==='__task') openTaskForm(null,D.todoLists[0]?.id);
      else ACTIONS[a]({}); }); }});
}

document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openPalette(); return; }
  if(e.key==='Escape'){ if(!$('#paletteRoot').classList.contains('hidden')) closePalette();
    else if(!$('#modalRoot').classList.contains('hidden')) closeModal();
    else $('#drawer').classList.add('hidden'); return; }
  if(typing) return;
  if(e.key==='n'){ e.preventDefault(); quickAddMenu(); }
  if(e.key==='/'){ e.preventDefault(); openPalette(); }
});

$('#btnMenu').onclick=()=>$('#drawer').classList.remove('hidden');
$$('[data-close-drawer]').forEach(b=>b.onclick=()=>$('#drawer').classList.add('hidden'));
$('#modalRoot').querySelector('[data-modal-backdrop]').onclick=closeModal;
$('#paletteRoot').querySelector('[data-palette-backdrop]').onclick=closePalette;
$('#btnSearch').onclick=openPalette;
$('#btnQuickAdd').onclick=quickAddMenu;
$('#btnTheme').onclick=()=>{ const next=document.documentElement.classList.contains('dark')?'violet':'dark';
  D.settings.theme=next; applyTheme(next); commit({render:false}); };
$('#btnSync').onclick=()=>{ if(!GH.token){ go('settings'); toast('Renseigne ton dépôt GitHub pour synchroniser.','info'); }
  else pushToGitHub(true).then(ok=>ok&&toast('Synchronisé.','ok')); };
$('#paletteInput').addEventListener('input',e=>paletteSearch(e.target.value));
$('#paletteInput').addEventListener('keydown',e=>{ if(e.key==='Enter'){ const first=$('#paletteResults button'); first&&first.click(); } });
window.addEventListener('beforeunload',e=>{ if(SYNC.dirty&&GH.token){ clearTimeout(SYNC.timer); pushToGitHub(); } });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&SYNC.dirty&&GH.token){ clearTimeout(SYNC.timer); pushToGitHub(); } });

function openSettings(){ go('settings'); }

/* démarrage */
(function init(){
  try{ const ui=JSON.parse(localStorage.getItem(LS_UI)||'{}'); if(ui.view) UI.view=ui.view; }catch(e){}
  bootData().then(()=>{
    if(!localStorage.getItem(LS_UI) && D.settings.start) { UI.view=D.settings.start; render(); }
    if(overdueTasks().length) toast(`${overdueTasks().length} tâche(s) en retard.`,'warn',{label:'Voir',fn:()=>go('tasks')});
  });
})();
</script>
